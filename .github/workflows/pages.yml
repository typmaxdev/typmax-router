#
# Publishes docs/demo/ (the plain-language demo page and its recorded responses) as the
# repository's GitHub Pages site. Static files only: docs/demo/data.js is committed, so
# no build of the router runs here; regenerate it with tools/demo_data.py when the
# boards or the binary change. Pages must be set to "GitHub Actions" as its source.
# Actions are pinned by commit SHA (tests/test_watcher.py t_every_workflow).
name: pages

on:
  push:
    branches: [main]
    paths: ["docs/demo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/demo
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
