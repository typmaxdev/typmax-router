# SPDX-FileCopyrightText: 2026 The typmax-router authors
#
# The container image: ghcr.io/typmaxdev/typmax-router, built from docker/Dockerfile
# (the same build-and-test image the README and the release watch use; its runtime
# stage is the binary alone at /usr/local/bin/typmax-router). GitHub-hosted runners
# only; the workflow's own GITHUB_TOKEN is the only credential (packages: write on the
# one job that pushes); every action pinned by commit SHA (the tag in the comment;
# Dependabot bumps them).
#
#   push to main      pushed, tagged `main` and `sha-<short sha>`
#   tag v*            pushed, tagged with the tag (`v1.2.3`) and, unless it is a
#                     pre-release, `latest`
#   workflow_dispatch pushed when run on main or a v* tag, otherwise built only
#   pull_request      built, smoke-tested, NOT pushed (a fork's token is read-only)
#
# The job prints the pushed image by DIGEST — `ghcr.io/typmaxdev/typmax-router@sha256:…`
# — in the step summary and as the job outputs `digest` and `ref`: a consumer pins the
# digest, never a tag (MAINTAINING.md "Container image"). linux/amd64 only: the one
# consumer builds a linux/amd64 image. provenance and sbom are OFF: with an attestation
# the pushed reference becomes an OCI index (the image plus an `unknown/unknown`
# attestation manifest), so the digest a consumer would pin names the index rather than
# the image; without them a single-platform push is one image manifest and the digest
# the job prints is the one `COPY --from=…@sha256:…` resolves.
#
# `pull_request` (never `pull_request_target`): a fork's pull request runs with a
# read-only token and no secrets.
name: image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write        # the push to ghcr.io; read-only on a fork's pull request
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      ref: ${{ steps.pushed.outputs.ref }}
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      # push only from main or a v* tag; a pull request and a dispatch on any other ref
      # build and smoke-test the same image without publishing it
      PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # main -> `main`; every push -> `sha-<short sha>`; a v* tag -> the tag verbatim
          # and (flavor latest=auto: a semver tag that is not a pre-release) `latest`;
          # a pull request -> `pr-<n>`, never pushed
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{raw}}
          # org.opencontainers.image.source and .revision are the action's defaults
          # (this repository's URL and the commit built); the binary is GPL-3.0-or-later
          # and its source is this repository at that commit
          labels: |
            org.opencontainers.image.title=typmax-router
            org.opencontainers.image.description=A PCB routing service on KiCad's push-and-shove router; JSON Lines on stdin/stdout (PROTOCOL.md)
            org.opencontainers.image.licenses=GPL-3.0-or-later
            org.opencontainers.image.vendor=typmaxdev

      - name: Build (and push from main or a v* tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          # a build that is not pushed is loaded into the runner's docker for the smoke step
          load: ${{ env.PUSH != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (the fixed path, --version, a ping line, the labels)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          REVISION: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -eu
          if [ "$PUSH" = true ]; then
            image="$IMAGE_NAME@$DIGEST"          # the pushed image, by digest, pulled back
          else
            image="$(printf '%s\n' "$TAGS" | head -1)"   # the loaded image, by its tag
          fi
          echo "image: $image"
          docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image"
          entry="$(docker image inspect --format '{{json .Config.Entrypoint}}' "$image")"
          [ "$entry" = '["/usr/local/bin/typmax-router"]' ] || { echo "::error::entrypoint is $entry, not the fixed path"; exit 1; }
          docker run --rm --entrypoint /usr/local/bin/typmax-router "$image" --version
          printf '%s\n' '{"id":1,"protocol_version":2,"method":"ping"}' | docker run --rm -i "$image" > ping.jsonl
          cat ping.jsonl
          python3 - <<'EOF'
          import json
          a = json.loads(open("ping.jsonl").read().splitlines()[0])
          r = a.get("result") or {}
          assert a.get("id") == 1 and a.get("ok") is True and r.get("pong") is True \
              and r.get("service") == "typmax-router", a
          print("pong ok:", r["engine"])
          EOF
          rev="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")"
          src="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$image")"
          lic="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}' "$image")"
          echo "labels: revision=$rev source=$src licenses=$lic"
          [ "$rev" = "$REVISION" ] || { echo "::error::revision label $rev != $REVISION"; exit 1; }
          [ "$src" = "$SOURCE" ] || { echo "::error::source label $src != $SOURCE"; exit 1; }
          [ "$lic" = "GPL-3.0-or-later" ] || { echo "::error::licenses label $lic"; exit 1; }

      - name: The pushed image, by digest
        id: pushed
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          REVISION: ${{ github.sha }}
        run: |
          set -eu
          ref="$IMAGE_NAME@$DIGEST"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          {
            echo "## Image pushed"
            echo
            echo '```'
            echo "$ref"
            echo '```'
            echo
            echo "- commit: \`$REVISION\`"
            echo "- tags: $(printf '%s\n' "$TAGS" | sed 's|.*:||' | paste -sd ' ' -)"
            echo "- pin it: \`COPY --from=$ref /usr/local/bin/typmax-router /usr/local/bin/typmax-router\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$ref"
