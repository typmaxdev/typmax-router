name: Bug report
description: A wrong answer, a crash, a hang or a build failure.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A minimal request stream that reproduces it is the most
        useful thing you can attach. Please do not attach boards you may not share
        publicly; a reduced board JSON is enough. Security problems go to
        [private reporting](https://github.com/typmaxdev/typmax-router/security/advisories/new), not here.
  - type: input
    id: version
    attributes:
      label: Version
      description: The `engine` object of a `ping` answer (name, version, pns, protocol), or the commit you built.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux x86_64 (docker image)
        - Linux x86_64 (native build)
        - macOS arm64
        - other (say below)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: For a routing result, say why the proposal is wrong (a clearance, a short, a missed route) and what KiCad's interactive router does with the same board.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The JSON Lines you sent (load_board + the failing request) and the answer you got. Attach a file if it is long.
      render: jsonl
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Build commands, compiler version, stderr output.
